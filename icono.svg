<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <!--
    Mi protocolo · la marca

    EL NUMERO, no un simbolo. 84 son los dias del protocolo: es el hecho que
    define esta app y no lo tiene ninguna otra.

    Se probo contra cinco alternativas montadas sobre una pantalla de inicio de
    verdad y medidas a 58, 40, 29 y 20 px. Se cayeron todas ahi: las cuatro
    fases y la cuadricula de los 84 dias se vuelven ruido, el dia en tres
    bandas se lee como un icono de lista, y el 4 en verde sobre tinta se hunde
    en el fondo. Un numero aguanta: los digitos son lo ultimo que se pierde al
    achicar. Antes de todo esto hubo una capsula de medicina; Vinz la rechazo y
    tenia razon, es el icono por defecto de toda app de suplementos.

    El verde es el FONDO, no un detalle, porque a 20 px un acento fino
    desaparece. La geometria (146 px de cuerpo, -12 de tracking, -6.75/-0.75 de
    desplazamiento) salio de converger midiendo la TINTA del PNG renderizado,
    no de la metrica de la fuente: el tracking negativo y el bearing de cada
    digito no son simetricos. Resultado: 92 % del ancho con 6 px de aire
    identico a cada lado.

    Los PNG que de verdad se instalan los genera scratchpad/gen-iconos.js
    rasterizando en el navegador, que es donde la webfont existe. Este archivo
    es la fuente de registro: si lo abres suelto necesita la fuente de Google.
  -->
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@800&amp;display=block');</style>
  </defs>
  <rect width="180" height="180" fill="#0E7A5F"/>
  <text x="83.25" y="89.25" text-anchor="middle" dominant-baseline="central"
        font-family="Schibsted Grotesk, sans-serif" font-weight="800" font-size="146"
        letter-spacing="-12" fill="#F7F8F7">84</text>
</svg>
