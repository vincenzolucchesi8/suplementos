<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <!--
    Mi protocolo · la marca: una PALTA DE MALLA

    Como esta hecha, que es lo unico que importa para rehacerla:
    la malla de color la GENERA FLUX en local (marca/malla.png) porque esas
    cintas fluidas no salen de un degradado escrito a mano, y la SILUETA va
    CODEADA, para que el borde siga limpio a 20 px en vez de ensuciarse como se
    ensucia cualquier imagen generada al achicarla. Las vetas de la malla se
    leen como la pulpa real de una palta; eso no se busco, salio del material.

    De donde salio la direccion: Vinz rechazo tres intentos dibujados a ojo (una
    capsula de medicina, el numero 84, y la palta plana vectorial) y en vez de
    seguir proponiendo a ciegas se le pusieron delante 25 iconos REALES bajados
    de la App Store. Eligio Darkroom y Yuka. Medidos los dos archivos, lo que
    comparten es: color saturado sin gris, cero detalle, cero sombra, cero
    texto, y formas de esquinas enormes. Darkroom es una malla de color que
    llena el cuadro; Yuka es un objeto limpio. La sintesis la dijo el mismo:
    "malla de color en forma de palta".

    Dos correcciones que costaron una vuelta cada una:
      · La palta como ovalo con un circulo al centro SE LEE COMO HUEVO FRITO.
        La salva el pellizco del cuello, arriba.
      · La figura nacia tocando el borde de abajo y la mascara squircle la
        mordia: se encoge al 95,5 % y se sube 6 unidades.

    Los PNG que de verdad se instalan los genera herramientas/gen-iconos.js.
    Este archivo es la fuente de registro y necesita marca/malla.png al lado.
  -->
  <defs>
    <clipPath id="silueta" clipPathUnits="userSpaceOnUse">
      <path d="M90 12c19 0 30 24 36 49 7 29 22 47 22 69 0 32-26 54-58 54s-58-22-58-54c0-22 15-40 22-69 6-25 17-49 36-49z"/>
    </clipPath>
  </defs>
  <rect width="180" height="180" fill="#0B1210"/>
  <g transform="translate(90 90) scale(.955) translate(-90 -96)">
    <g clip-path="url(#silueta)">
      <image href="marca/malla.png" x="-14" y="-14" width="208" height="208" preserveAspectRatio="xMidYMid slice"/>
    </g>
    <circle cx="90" cy="118" r="30" fill="#0B1210"/>
    <circle cx="90" cy="118" r="23" fill="#F2A33A"/>
  </g>
</svg>
